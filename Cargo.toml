[workspace]
resolver = "2"
members = [
    "apps/gilb-app-tauri/src-tauri",
    "apps/gilb-mcp",
    "apps/gilb-analyzer",
    "crates/gilb-core",
    "crates/gilb-config",
    "crates/gilb-events",
    "crates/gilb-a11y",
    "crates/gilb-assist",
    "crates/gilb-assist-acp",
    "crates/gilb-assist-audio",
    "crates/gilb-db",
    "crates/gilb-engine",
    "crates/gilb-meeting",
    "crates/gilb-pipeline",
    "crates/gilb-record",
    "crates/gilb-shell-tauri",
    "crates/gilb-transcribe",
]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
publish = false
authors = ["Leonid Dinershtein <leonid@dinershtein.com>"]
description = "macOS desktop app that records user activity via accessibility APIs into a local SQLite database."
homepage = "https://github.com/farol-team/workscreen"
repository = "https://github.com/farol-team/workscreen"
keywords = ["accessibility", "activity", "recorder", "macos", "tauri"]
categories = ["accessibility", "os::macos-apis"]
readme = "README.md"

[workspace.dependencies]
# async / runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for downloading the local transcription model from HuggingFace.
# rustls-tls keeps us off OpenSSL; default features are dropped so the default
# native-tls backend is never pulled in.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

# database
# Local SQLite only — no network, so no TLS backend (drops rustls/ring,
# which also lets the Windows target cross-check from a mac).
sqlx = { version = "0.7", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "migrate",
    "chrono",
    "uuid",
    "macros",
] }

# concurrency primitives
arc-swap = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
dashmap = "5"
once_cell = "1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# IPC
interprocess = { version = "2", features = ["tokio"] }

# time / ids
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# misc utilities
arboard = "3"
regex = "1"
directories = "5"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# MCP
rmcp = { version = "1", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"

# error
anyhow = "1"
thiserror = "1"

# internal crates
gilb-core = { path = "crates/gilb-core" }
gilb-config = { path = "crates/gilb-config" }
gilb-events = { path = "crates/gilb-events" }
gilb-a11y = { path = "crates/gilb-a11y" }
gilb-assist = { path = "crates/gilb-assist" }
gilb-assist-acp = { path = "crates/gilb-assist-acp" }
gilb-assist-audio = { path = "crates/gilb-assist-audio" }
gilb-db = { path = "crates/gilb-db" }
gilb-engine = { path = "crates/gilb-engine" }
gilb-meeting = { path = "crates/gilb-meeting" }
gilb-pipeline = { path = "crates/gilb-pipeline" }
gilb-record = { path = "crates/gilb-record" }
gilb-shell-tauri = { path = "crates/gilb-shell-tauri" }
gilb-transcribe = { path = "crates/gilb-transcribe" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gilb</title>
    <script type="module" src="/src/countdown.ts" defer></script>
  </head>
  <body class="countdown-window">
    <main class="countdown">
      <p class="countdown-lead">Recording is about to start for</p>
      <h1 class="countdown-app" id="countdown-app">this meeting</h1>

      <button id="btn-record" class="countdown-record" type="button">
        <span class="countdown-fill" id="countdown-fill" aria-hidden="true"></span>
        <span class="countdown-record-label">Record now</span>
      </button>

      <button id="btn-cancel" class="countdown-cancel" type="button">
        Cancel
      </button>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gilb Settings</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body class="settings-window">
    <main class="settings">
      <h1 class="settings-title">Settings</h1>

      <div class="settings-row">
        <div class="settings-row-text">
          <span class="settings-row-label" id="meeting-label">
            Enable meeting detection
          </span>
          <span class="settings-row-desc">
            Watch for active calls and offer to record when one starts.
          </span>
        </div>
        <button
          id="toggle-meeting"
          class="toggle"
          type="button"
          role="switch"
          aria-checked="false"
          aria-labelledby="meeting-label"
        >
          <span class="toggle-knob" aria-hidden="true"></span>
        </button>
      </div>

      <div class="settings-row settings-row-stacked">
        <div class="settings-row-text">
          <span class="settings-row-label" id="openai-label">
            OpenAI API key
          </span>
          <span class="settings-row-desc">
            Bring your own key to transcribe recorded meetings. Stored
            locally only; clear the field to disable transcription.
          </span>
        </div>
        <input
          id="openai-key"
          class="key-input"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="sk-…"
          aria-labelledby="openai-label"
        />
        <div class="key-actions">
          <button id="btn-save-key" class="key-btn key-btn-primary" type="button">
            Save
          </button>
          <button id="btn-test-key" class="key-btn" type="button">
            Test
          </button>
        </div>
        <span id="key-status" class="key-status" role="status" aria-live="polite"></span>
      </div>
    </main>
  </body>
</html>

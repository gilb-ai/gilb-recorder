<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gilb</title>
    <script type="module" src="/src/stop-countdown.ts" defer></script>
  </head>
  <body class="countdown-window">
    <main class="countdown">
      <p class="countdown-lead">Gilb Meeting Recording is about to stop for</p>
      <h1 class="countdown-app" id="countdown-app">this meeting</h1>

      <button
        id="btn-stop"
        class="countdown-record countdown-record--stop"
        type="button"
      >
        <span class="countdown-fill" id="countdown-fill" aria-hidden="true"></span>
        <span class="countdown-record-label">Stop now</span>
      </button>

      <button id="btn-keep" class="countdown-cancel" type="button">
        Keep recording
      </button>
    </main>
  </body>
</html>

[package]
name = "gilb-app-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "gilb (Gilbreth) — accessibility-driven activity recorder"
authors = ["Leonid Dinershtein"]

[lib]
name = "gilb_app_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
base64 = "0.22"
directories = { workspace = true }
uuid = { workspace = true }
url = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Streaming download of the local transcription model from HuggingFace.
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }

gilb-core = { workspace = true }
gilb-config = { workspace = true }
gilb-events = { workspace = true }
gilb-a11y = { workspace = true }
gilb-db = { workspace = true }
gilb-engine = { workspace = true }
gilb-meeting = { workspace = true }
gilb-record = { workspace = true }
gilb-transcribe = { workspace = true, features = ["local-whisper"] }

[dev-dependencies]
# Construct MeetingEvent timestamps in the meeting-bridge mapping tests.
chrono = { workspace = true }

# Desktop-only plugins. The updater builds on desktop OSes; single-instance
# (with the deep-link feature) routes a `gilb://` link to the running instance
# on Windows/Linux — on macOS the OS delivers it to the deep-link handler.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[package]
name = "gilb-app-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "gilb (Gilbreth) — accessibility-driven activity recorder"
authors = ["Leonid Dinershtein"]

# serde_json has no `use` anywhere — it is reached only through
# `tauri::generate_context!`, which dependency scanners cannot see.
[package.metadata.cargo-machete]
ignored = ["serde_json"]

[lib]
name = "gilb_app_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
uuid = { workspace = true }
url = "2"
serde = { workspace = true }
# No `use` anywhere — `tauri::generate_context!` expands to `::serde_json`
# paths, so the crate must be a direct dependency. Removing it fails the build
# inside a macro expansion, which is not obvious from the error.
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }

gilb-config = { workspace = true }
gilb-events = { workspace = true }
gilb-db = { workspace = true }
gilb-engine = { workspace = true }
gilb-shell-tauri = { workspace = true, features = [
    # Real-time suggestions: overlay window, commands, whisper model gate.
    "assist",
] }
# gilb's own halves of the assist stack: the prompt file and the local agent.
gilb-assist = { workspace = true }
gilb-assist-acp = { workspace = true }
async-trait = "0.1"
gilb-transcribe = { workspace = true, features = ["local-whisper"] }

[target.'cfg(unix)'.dependencies]
# SIGTERM the analyzer daemon for a graceful stop (see analyzer_supervisor).
libc = "0.2"

# Desktop-only plugins. The updater builds on desktop OSes; single-instance
# (with the deep-link feature) routes a `gilb://` link to the running instance
# on Windows/Linux — on macOS the OS delivers it to the deep-link handler.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

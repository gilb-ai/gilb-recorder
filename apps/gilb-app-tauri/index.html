<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gilb</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>gilb</h1>
        <p class="subtitle">Layer 1 — accessibility capture</p>
      </header>

      <section class="card">
        <h2>Статус</h2>
        <ul id="status-list" class="status-list">
          <li><span class="dot" id="status-platform-dot"></span><strong>Platform:</strong> <span id="status-platform">…</span></li>
          <li><span class="dot" id="status-ax-dot"></span><strong>Accessibility:</strong> <span id="status-ax">…</span></li>
          <li><span class="dot" id="status-im-dot"></span><strong>Input Monitoring:</strong> <span id="status-im">…</span></li>
          <li><span class="dot" id="status-rec-dot"></span><strong>Recording:</strong> <span id="status-rec">…</span></li>
          <li><strong>Session:</strong> <span id="status-session">—</span></li>
          <li><strong>Actions сегодня:</strong> <span id="status-actions">0</span></li>
        </ul>
      </section>

      <section class="card">
        <div class="row">
          <button id="btn-start" type="button">Start</button>
          <button id="btn-stop" type="button" disabled>Stop</button>
        </div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>

[package]
name = "gilb-analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shannon — local, auditable analyzer: runs prompt-jobs as claude over gilb-mcp and pushes findings to gilb-web."

[[bin]]
name = "gilb-analyzer"
path = "src/main.rs"

[dependencies]
gilb-db = { workspace = true }
gilb-config = { workspace = true }

sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# getppid/raise for the parent-death guard in the `run` daemon.
libc = "0.2"

[package]
name = "gilb-shell-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Reusable Tauri meeting-flow glue (countdown windows, settings/privacy commands, MeetingUi) for gilb-based shells"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
# Wall-clock stamps in the meeting's assist journal.
chrono = { workspace = true }
url = "2"
tracing = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }

gilb-config = { workspace = true }
gilb-events = { workspace = true }
gilb-pipeline = { workspace = true }
gilb-record = { workspace = true }
gilb-a11y = { workspace = true }
gilb-db = { workspace = true }

# Real-time suggestions (feature `assist`): the engine, the audio front-end and
# the model download. Optional because a shell that does not ship suggestions
# should not build whisper.cpp.
gilb-assist = { workspace = true, optional = true }
gilb-assist-audio = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }

[features]
# The overlay, its commands and the whisper-model gate. Pulls in whisper.cpp
# through gilb-assist-audio, so it is off unless a shell asks for it.
# The whisper model downloader on its own: transcription needs it without the
# overlay and without whisper.cpp.
model-download = ["dep:reqwest"]
assist = [
    "model-download",
    "dep:gilb-assist",
    "dep:gilb-assist-audio",
    "gilb-assist-audio/whisper",
    "gilb-assist-audio/silero",
    "dep:reqwest",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-global-shortcut",
]

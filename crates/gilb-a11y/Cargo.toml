[package]
name = "gilb-a11y"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gilb-core = { workspace = true }
gilb-config = { workspace = true }
gilb-events = { workspace = true }
gilb-db = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
crossbeam-channel = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"

# CLI bin only
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
core-foundation-sys = "0.8"
foreign-types-shared = "0.3"
accessibility-sys = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSValue", "NSDictionary", "NSDate", "NSArray", "NSNotification", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.58"
arboard = "3"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

[[bin]]
name = "gilb-a11y-cli"
path = "src/bin/gilb-a11y-cli.rs"

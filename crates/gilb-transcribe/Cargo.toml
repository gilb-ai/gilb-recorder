[package]
name = "gilb-transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gilb-db = { workspace = true }

serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# Dyn-dispatched async trait (`&dyn Transcriber`) so the real whisper.cpp path is
# swappable for a mock in tests.
async-trait = "0.1"

# Local Whisper (whisper.cpp via whisper-rs), gated behind `local-whisper` so the
# heavy C++/GPU build stays opt-in. `hound` reads the 16 kHz mono i16 wav.
# `metal` is Apple-only, so it is enabled only on macOS; other platforms build
# the CPU backend (whisper.cpp still needs a C/C++ toolchain + CMake present).
hound = { version = "3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# 0.16 pulls whisper-rs-sys 0.15, whose build script forwards GGML_* env vars to
# the ggml CMake build — letting the release set GGML_NATIVE=OFF for a portable
# (no-i8mm) binary that compiles on the M1 CI runner and runs on all Apple Silicon.
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", optional = true }

[features]
local-whisper = ["dep:whisper-rs", "dep:hound"]

# PoC: measure local turbo quality/speed on a real meeting wav across languages.
[[example]]
name = "local_poc"
required-features = ["local-whisper"]

[dev-dependencies]
# Lets `examples/local_poc.rs` show the transcriber's own decisions (the pinned
# language above all) instead of swallowing them.
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

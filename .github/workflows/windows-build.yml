name: Windows build

# Builds the Tauri desktop app on a hosted Windows runner and uploads the
# NSIS installer as an artifact. Useful for validating the Windows capture
# backend end-to-end without a local Windows toolchain. This is a smoke
# build — signed, updater-enabled release builds are cut by release.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm deps
        working-directory: apps/gilb-app-tauri
        run: npm install

      # `tauri build` runs the beforeBuildCommand (bash build-sidecars.sh +
      # vite build); bash ships on GitHub's Windows runners. No code signing.
      # Override createUpdaterArtifacts=false so the smoke build doesn't need
      # the updater signing key (that's only for release in windows-release.yml).
      - name: Build Tauri app
        working-directory: apps/gilb-app-tauri
        shell: bash
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gilb-windows-nsis
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

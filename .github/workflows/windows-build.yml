name: Windows build

# Builds the Tauri desktop app on a hosted Windows runner and uploads the
# .msi installer as an artifact. Useful for validating the Windows capture
# backend end-to-end without a local Windows toolchain.

on:
  workflow_dispatch:
  push:
    branches: [main, windows-capture-backend]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm deps
        working-directory: apps/gilb-app-tauri
        run: npm install

      # `tauri build` runs the beforeBuildCommand (bash build-sidecars.sh +
      # vite build); bash ships on GitHub's Windows runners. Tauri downloads
      # the WiX toolset for the .msi automatically. No code signing.
      - name: Build Tauri app
        working-directory: apps/gilb-app-tauri
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gilb-windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error

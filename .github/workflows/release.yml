name: Release

# Tag-driven signed release for macOS (aarch64 + x86_64) and Windows (x64).
# Builds with tauri-action, signs the updater artifacts (minisign), code-signs
# + notarizes (macOS) / Authenticode-signs (Windows), creates a draft GitHub
# Release, uploads the installers + updater bundles, and generates latest.json
# (the updater endpoint configured in tauri.conf.json).
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY            updater private key (content of ~/.tauri/gilb-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password ("" if none)
#   APPLE_CERTIFICATE                    base64 of the Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD           .p12 password
#   APPLE_SIGNING_IDENTITY               e.g. "Developer ID Application: … (83856566PM)"
#   APPLE_API_ISSUER                     App Store Connect API issuer id
#   APPLE_API_KEY                        App Store Connect API key id
#   APPLE_API_KEY_BASE64                 base64 of the AuthKey_*.p8
#   WINDOWS_CERT_PFX_BASE64              base64 of the code-signing .pfx
#   WINDOWS_CERT_PASSWORD                .pfx password

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm deps
        working-directory: apps/gilb-app-tauri
        run: npm install

      # macOS: materialize the App Store Connect API key (.p8) for notarization.
      - name: Prepare Apple API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 -d > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      # Windows: import the code-signing PFX and write a signing config overlay
      # (certificateThumbprint) for tauri to Authenticode-sign the NSIS + exe.
      - name: Prepare Windows signing
        if: runner.os == 'Windows'
        working-directory: apps/gilb-app-tauri
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\gilb.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $sec = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          Remove-Item $pfx -Force
          $overlay = [ordered]@{ bundle = [ordered]@{ windows = [ordered]@{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 6
          Set-Content -Path "src-tauri\tauri.signing.json" -Value $overlay -Encoding utf8

      - name: Build + sign + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (all platforms).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code-sign + notarize.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: apps/gilb-app-tauri
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Gilb __VERSION__"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: >-
            --target ${{ matrix.target }}
            ${{ runner.os == 'Windows' && '-c src-tauri/tauri.signing.json' || '' }}

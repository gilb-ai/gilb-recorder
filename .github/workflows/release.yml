name: Release

# Tag-driven signed release for macOS (aarch64 + x86_64) and Windows (x64).
# Builds with tauri-action, signs the updater artifacts (minisign), code-signs
# + notarizes (macOS) / Authenticode-signs (Windows), creates a draft GitHub
# Release, uploads the installers + updater bundles, and generates latest.json
# (the updater endpoint configured in tauri.conf.json).
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY            updater private key (content of ~/.tauri/gilb-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password ("" if none)
#   APPLE_CERTIFICATE                    base64 of the Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD           .p12 password
#   APPLE_SIGNING_IDENTITY               e.g. "Developer ID Application: … (83856566PM)"
#   APPLE_API_ISSUER                     App Store Connect API issuer id
#   APPLE_API_KEY                        App Store Connect API key id
#   APPLE_API_KEY_BASE64                 base64 of the AuthKey_*.p8
#   ES_USERNAME                          SSL.com eSigner username
#   ES_PASSWORD                          SSL.com eSigner password
#   ES_CREDENTIAL_ID                     eSigner signing credential id
#   ES_TOTP_SECRET                       eSigner TOTP secret (base32)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm deps
        working-directory: apps/gilb-app-tauri
        run: npm install

      # macOS: materialize the App Store Connect API key (.p8) for notarization.
      - name: Prepare Apple API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 -d > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      # Windows: download SSL.com CodeSignTool (cloud/eSigner signing) and write
      # a signing overlay whose signCommand runs our wrapper. Tauri then
      # Authenticode-signs the .exe + NSIS *before* computing the updater
      # signature, so the uploaded artifact matches its .sig.
      - name: Prepare Windows signing (SSL.com eSigner)
        if: runner.os == 'Windows'
        working-directory: apps/gilb-app-tauri
        shell: pwsh
        run: |
          $ver = "1.3.0"
          $zip = "$env:RUNNER_TEMP\codesigntool.zip"
          Invoke-WebRequest "https://github.com/SSLcom/CodeSignTool/releases/download/v$ver/CodeSignTool-v$ver-windows.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\codesigntool" -Force
          $tool = (Get-ChildItem "$env:RUNNER_TEMP\codesigntool" -Recurse -Filter CodeSignTool.bat | Select-Object -First 1).DirectoryName
          "CODE_SIGN_TOOL_PATH=$tool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $wrapper = (Resolve-Path "scripts\sign-windows.ps1").Path
          # Object form ({cmd,args}) avoids Tauri's shell-parsing of a string
          # command, which mangles Windows backslashes/quotes. %1 = the file.
          $overlay = [ordered]@{ bundle = [ordered]@{ windows = [ordered]@{
            signCommand = [ordered]@{
              cmd = "pwsh"
              args = @("-NoProfile", "-File", $wrapper, "%1")
            }
          } } } | ConvertTo-Json -Depth 8
          Set-Content -Path "src-tauri\tauri.signing.json" -Value $overlay -Encoding utf8

      - name: Build + sign + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (all platforms).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code-sign + notarize.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          # Windows code-sign via SSL.com eSigner (read by scripts/sign-windows.ps1).
          CODE_SIGN_TOOL_PATH: ${{ env.CODE_SIGN_TOOL_PATH }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        with:
          projectPath: apps/gilb-app-tauri
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Gilb __VERSION__"
          releaseDraft: true
          # Tags with a semver pre-release suffix (v1.1.0-beta.1, -rc.1, …) are
          # marked pre-release, so `releases/latest` (the stable updater
          # endpoint) skips them — stable users never auto-update to a beta.
          # Testers install the pre-release build manually.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          includeUpdaterJson: true
          args: >-
            --target ${{ matrix.target }}
            ${{ runner.os == 'Windows' && '-c src-tauri/tauri.signing.json' || '' }}

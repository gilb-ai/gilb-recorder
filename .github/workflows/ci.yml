name: CI

# Fast Linux checks for the Rust workspace. Runs on every PR (and on main) and
# is the required status check for branch protection — main stays green and
# shippable. The Tauri crates (gilb-app-tauri and gilb-shell-tauri) are
# excluded: they need GTK/WebKit system libs to compile on Linux and only ship
# on macOS/Windows. gilb-shell-tauri — which now carries the suggestions
# overlay and its model gate, not just glue — is linted and tested by
# shell.yml on macOS; the app crate by windows-build.yml (smoke) and
# release.yml.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude gilb-app-tauri --exclude gilb-shell-tauri --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude gilb-app-tauri --exclude gilb-shell-tauri

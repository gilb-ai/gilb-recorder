name: CI

# Rust workspace checks. Two jobs:
#  * check      — fast Linux clippy/fmt/test (the required branch-protection gate).
#  * macos-check — compiles + tests the macOS-only capture code that lives behind
#                  `cfg(target_os = "macos")` (gilb-a11y platform/macos: event_tap,
#                  ax_worker, focus, keyboard, pasteboard, …). The Linux job never
#                  sees that code, so without this job the macOS a11y path was only
#                  ever compiled at release time (release.yml, on a v* tag).
# Runs on every PR and on pushes to main / epic-v2 (the active integration branch).
# The Tauri crates (gilb-app-tauri, gilb-shell-tauri) are excluded from both jobs:
# they need GTK/WebKit on Linux and are validated by windows-build.yml (smoke) and
# release.yml (full signed build) instead.

on:
  pull_request:
  push:
    branches: [main, epic-v2]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude gilb-app-tauri --exclude gilb-shell-tauri --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude gilb-app-tauri --exclude gilb-shell-tauri

  macos-check:
    # Verifies the cfg(target_os = "macos") capture code the Linux job can't
    # compile. clippy is enough to type-check the FFI (event_tap/ax_worker);
    # tests run the platform-neutral suites (the macOS FFI has no unit tests
    # that need TCC/accessibility permission).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (macOS)
        run: cargo clippy --workspace --exclude gilb-app-tauri --exclude gilb-shell-tauri --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude gilb-app-tauri --exclude gilb-shell-tauri

name: CI

# Fast Linux checks for the Rust workspace. Runs on every PR (and on main) and
# is the required status check for branch protection — main stays green and
# shippable. The Tauri crates (gilb-app-tauri and gilb-shell-tauri) are
# excluded: they need GTK/WebKit system libs to compile on Linux and only ship
# on macOS/Windows. gilb-shell-tauri — which now carries the suggestions
# overlay and its model gate, not just glue — is linted and tested by
# shell.yml on macOS; the app crate by windows-build.yml (smoke build on every
# push to main) and release.yml.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude gilb-app-tauri --exclude gilb-shell-tauri --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude gilb-app-tauri --exclude gilb-shell-tauri

      # The app version lives in three files that cannot read each other. The
      # Cargo one is stamped into every recorded session row and reported as
      # the MCP server's version, so drift silently mislabels data rather than
      # breaking a build. Needs no toolchain — checked here, not at release
      # time, so a bump lands complete.
      - name: Versions in sync
        run: |
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          tauri="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' apps/gilb-app-tauri/src-tauri/tauri.conf.json | head -1)"
          npm="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' apps/gilb-app-tauri/package.json | head -1)"
          echo "Cargo=$cargo tauri.conf.json=$tauri package.json=$npm"
          test "$cargo" = "$tauri" && test "$cargo" = "$npm" || {
            echo "::error::version mismatch — see RELEASING.md"; exit 1; }

name: Windows release (signed)

# Signed Windows build. Imports the code-signing PFX from secrets, derives its
# thumbprint, and builds + signs the .exe and .msi. Runs on tags (v*) or
# manual dispatch — NOT on every push, so secrets aren't exposed to PR builds.
#
# Required repo secrets:
#   WINDOWS_CERT_PFX_BASE64  base64 of the .pfx (Convert.ToBase64String of the file bytes)
#   WINDOWS_CERT_PASSWORD    the PFX password

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm deps
        working-directory: apps/gilb-app-tauri
        run: npm install

      - name: Build + sign
        working-directory: apps/gilb-app-tauri
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: pwsh scripts/build-windows-signed.ps1

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: gilb-windows-msi-signed
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
